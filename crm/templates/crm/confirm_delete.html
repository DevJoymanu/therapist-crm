{% extends "crm/base.html" %}

{% block title %}Confirm Delete | Therapist CRM{% endblock %}

{% block content %}
<section class="mx-auto max-w-xl rounded-2xl border border-rose-200 bg-white p-6 shadow-sm">
  <p class="text-sm font-medium text-rose-700">Confirm delete</p>
  <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-950">Delete this record?</h1>
  <p class="mt-3 text-sm text-slate-600">This action permanently removes {{ object }}.</p>
  <form method="post" class="mt-6 flex justify-end gap-3" hx-post="{{ request.path }}" hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML" hx-push-url="true" hx-indicator="#page-spinner">
    {% csrf_token %}
    <a class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50" href="{{ request.META.HTTP_REFERER|default:'/' }}">Cancel</a>
    <button class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-semibold text-white shadow-sm shadow-rose-600/20 hover:bg-rose-700" type="submit">Delete</button>
  </form>
</section>
{% endblock %}
