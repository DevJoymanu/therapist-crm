<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Too Many Requests</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex items-center justify-center text-slate-900 antialiased px-4 py-12">
<div class="mx-auto max-w-md text-center">

  <div class="inline-flex h-16 w-16 items-center justify-center rounded-full bg-rose-100">
    <svg class="h-8 w-8 text-rose-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
  </div>

  <h1 class="mt-5 text-2xl font-bold tracking-tight text-slate-900">Too many requests</h1>
  <p class="mt-3 text-base text-slate-600">
    You've made too many requests in a short period. Please wait a few minutes and try again.
  </p>

  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 text-sm text-slate-600 shadow-sm">
    <p>If you believe this is an error, please contact your counsellor directly.</p>
  </div>

  <p class="mt-8 text-xs text-slate-400">HTTP 429 &mdash; Yanrol Systemic Family Counselling Services &amp; Therapy</p>
</div>
</body>
</html>
