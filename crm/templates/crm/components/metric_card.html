<article class="h-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium text-slate-500">{{ label }}</p>
      <p class="mt-3 text-3xl font-semibold tracking-tight text-slate-950">{{ value }}</p>
    </div>
    <div class="shrink-0 rounded-xl bg-{{ tone|default:'blue' }}-50 px-2.5 py-1 text-xs font-semibold text-{{ tone|default:'blue' }}-700">{{ hint }}</div>
  </div>
</article>
