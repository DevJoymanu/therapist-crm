{% if url %}<a href="{{ url }}" class="card block h-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">{% else %}<article class="h-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">{% endif %}
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium text-slate-500">{{ label }}</p>
      <p class="mt-3 text-3xl font-semibold tracking-tight text-slate-950">{{ value }}</p>
    </div>
    <div class="flex flex-col items-end gap-3">
      <div class="shrink-0 rounded-xl bg-{{ tone|default:'blue' }}-50 px-2.5 py-1 text-xs font-semibold text-{{ tone|default:'blue' }}-700">{{ hint }}</div>
      {% if url %}
        <svg class="h-3.5 w-3.5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg>
      {% endif %}
    </div>
  </div>
{% if url %}</a>{% else %}</article>{% endif %}
