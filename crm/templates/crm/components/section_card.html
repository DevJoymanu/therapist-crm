<section class="rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="flex items-center justify-between gap-4 border-b border-slate-100 px-5 py-4">
    <div>
      <h2 class="text-base font-semibold text-slate-950">{{ title }}</h2>
      {% if subtitle %}<p class="mt-1 text-sm text-slate-500">{{ subtitle }}</p>{% endif %}
    </div>
    {% if action_url and action_label %}
      <a href="{{ action_url }}" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">{{ action_label }}</a>
    {% endif %}
  </div>
  <div class="p-5">
    {{ body }}
  </div>
</section>
